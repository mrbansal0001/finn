[project]
name = "finn-worker"
version = "0.1.0"
description = "FINN ingest worker: NSE filings, results XBRL, prices, transcripts"
readme = "README.md"
authors = [
    { name = "Tanish Bansal", email = "btanish23@iitk.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "pywebpush>=2.5.0",
    "rapidfuzz>=3.14.6",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
