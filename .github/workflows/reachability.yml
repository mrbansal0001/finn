name: reachability-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I worker/probes/reachability.py probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: probe.json
